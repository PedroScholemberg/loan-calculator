services:
  backend:
    build:
      context: ./backend
    ports:
      - "8081:8080"
    healthcheck:
      # Verify HTTP readiness through the existing endpoint without calculating a loan.
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--request", "OPTIONS", "http://127.0.0.1:8080/api/v1/loans/amortization-schedule"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
